[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scarascope-ai"
version = "0.6.0"
description = "A source-grounded financial research assistant with optional local/cloud LLM routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "python-dotenv>=1,<2",
  "reportlab>=4.2,<5",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
discord = ["discord.py>=2.4,<3"]
semantic = ["sentence-transformers>=3.4,<6"]

[tool.setuptools.packages.find]
include = ["scarascope*"]

[tool.setuptools.package-data]
scarascope = ["static/*", "static/engineering/*", "evaluation/datasets/*.json", "evaluation/datasets/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
