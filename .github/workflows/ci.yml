name: Python CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q scarascope
      - run: python -m pytest -q
      - name: Produce reproducible offline benchmark report
        run: python -m scarascope.evaluation.runner --fail-on-regression --output "$RUNNER_TEMP/scarascope-benchmark.json" > /dev/null
      - name: Upload benchmark JSON artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scarascope-offline-benchmarks
          path: ${{ runner.temp }}/scarascope-benchmark.json
          if-no-files-found: warn
