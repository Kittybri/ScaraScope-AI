name: Python CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q scarascope
      - name: Run all tests and export JUnit results
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/pytest-results.xml"
      - name: Produce reproducible offline benchmark report
        run: python -m scarascope.evaluation.runner --fail-on-regression --output "$RUNNER_TEMP/scarascope-benchmark.json" > /dev/null
      - name: Validate pinned real-SEC intake plan without contacting SEC
        run: python -m scarascope.evaluation.corpus.cli plan-check --plan docs/evidence/sec_intake_plan_v1.json
      - name: Verify SEC corpus tooling stays offline in CI
        run: python -m scarascope.evaluation.corpus.cli inventory > "$RUNNER_TEMP/sec-corpus-readiness.json"
      - name: Upload SEC corpus readiness artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scarascope-real-corpus-readiness
          path: ${{ runner.temp }}/sec-corpus-readiness.json
          if-no-files-found: warn
      - name: Upload benchmark JSON artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scarascope-offline-benchmarks
          path: ${{ runner.temp }}/scarascope-benchmark.json
          if-no-files-found: warn
      - name: Upload pytest JUnit artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scarascope-pytest-results
          path: ${{ runner.temp }}/pytest-results.xml
          if-no-files-found: warn
