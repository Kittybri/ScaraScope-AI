name: Deploy to Oracle Compute (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scarascope-oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: oracle
    steps:
      - name: Deploy this exact commit over verified SSH
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${OCI_HOST:?Set OCI_HOST in the oracle environment}"
          : "${OCI_SSH_USER:?Set OCI_SSH_USER in the oracle environment}"
          : "${OCI_SSH_PRIVATE_KEY:?Set OCI_SSH_PRIVATE_KEY in the oracle environment}"
          : "${OCI_SSH_KNOWN_HOSTS:?Set OCI_SSH_KNOWN_HOSTS in the oracle environment}"
          [[ "$OCI_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$OCI_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          umask 077
          key_file=$(mktemp)
          hosts_file=$(mktemp)
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=20 "$OCI_SSH_USER@$OCI_HOST" bash -s -- "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          cd /opt/scarascope-ai
          sudo -n git fetch --depth 1 origin "$1"
          sudo -n git checkout --detach FETCH_HEAD
          test "$(sudo -n git rev-parse HEAD)" = "$1"
          sudo -n bash deploy/oracle/deploy.sh
          REMOTE
